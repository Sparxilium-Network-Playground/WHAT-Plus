[package]
name = "whatplus-server"
description = "WHAT Plus 伺服器：SSH 收集用量、排程報告、Discord 發送、Admin TUI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "whatplus-server"
path = "src/main.rs"

[dependencies]
what-core.workspace = true
whatplus-proto.workspace = true
whatplus-ssh.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
tokio.workspace = true
russh.workspace = true
ipnet.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossterm.workspace = true
sqlite = { version = "0.37.4", default-features = false, features = ["bundled", "linkage"] }
ureq = { version = "3", features = ["json"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true
